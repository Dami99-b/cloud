name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  ENVIRONMENT: ci
  LOG_LEVEL: WARNING
  DATABASE_URL: postgresql+asyncpg://filestore:filestore@localhost:5432/filestore
  REDIS_URL: redis://localhost:6379/0
  S3_ENDPOINT_URL: http://localhost:4566
  S3_PUBLIC_ENDPOINT_URL: http://localhost:4566
  S3_BUCKET: user-uploads
  S3_REGION: us-east-1
  AWS_ACCESS_KEY_ID: test
  AWS_SECRET_ACCESS_KEY: test
  AWS_DEFAULT_REGION: us-east-1
  MULTIPART_THRESHOLD_BYTES: "52428800"
  MULTIPART_CHUNK_SIZE_BYTES: "5242880"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - name: Ruff
        run: |
          ruff check .
          ruff format --check .

  test:
    name: Integration tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: filestore
          POSTGRES_PASSWORD: filestore
          POSTGRES_DB: filestore
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U filestore -d filestore"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      localstack:
        image: localstack/localstack:3.8
        env:
          SERVICES: s3
          DEBUG: "0"
          AWS_DEFAULT_REGION: us-east-1
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
        ports:
          - 4566:4566
        options: >-
          --health-cmd "curl -fsS http://localhost:4566/_localstack/health"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
          --health-start-period 20s

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - name: Enable ltree
        env:
          PGPASSWORD: filestore
        run: |
          psql -h localhost -U filestore -d filestore -c "CREATE EXTENSION IF NOT EXISTS ltree;"
          psql -h localhost -U filestore -d filestore -c "CREATE EXTENSION IF NOT EXISTS btree_gist;"

      - name: Wait for LocalStack S3
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:4566/_localstack/health | grep -q '"s3"'; then
              echo "S3 is up"; exit 0
            fi
            sleep 2
          done
          echo "LocalStack S3 never became available" >&2
          curl -sS http://localhost:4566/_localstack/health || true
          exit 1

      - name: Run migrations
        run: alembic upgrade head

      - name: Create the uploads bucket
        run: python scripts/bootstrap_s3.py

      - name: Pytest
        run: pytest -v --cov=app --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: ignore

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: filestore:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Compose config is valid
        run: docker compose config --quiet

      - name: Entrypoint is wired up
        run: docker run --rm --entrypoint python filestore:ci -c "import app.main, app.worker.main"
